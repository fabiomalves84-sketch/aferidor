[project]
name = "aferidor"
dynamic = ["version"]
description = "Banco de ensaio para respostas clínicas de modelos de linguagem em português europeu"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fábio Alves" }]
dependencies = []

[project.scripts]
aferidor = "aferidor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "aferidor.__version__" }

[tool.setuptools.packages.find]
include = ["aferidor*"]

# Ferramenta de desenvolvimento, fora do runtime e da bateria de testes (não é uma dependência
# do pacote): `ruff check .` com as regras mínimas, imports não usados e erros evidentes.
[tool.ruff]
target-version = "py310"
extend-exclude = ["ensaios", "docs", "data", "relatorios", "_to_delete", "vinhetas", "Claude outputs"]

[tool.ruff.lint]
select = ["F", "E9"]
